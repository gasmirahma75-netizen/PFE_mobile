name: frontend_flutter
description: "Application d'Audit de Contrats par IA - La Poste Tunisienne"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  
  # --- UI & DESIGN ---
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  
  # --- BUSINESS INTELLIGENCE (GRAPHIQUES) ---
  fl_chart: ^0.66.0

  # --- COMMUNICATION & SERVICES ---
  http: ^1.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2

  # --- GESTION DES FICHIERS & PHOTOS ---
  image_picker: ^1.0.7
  file_picker: ^8.0.1 
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0

  # --- AJOUTS POUR SPRINT 4 : FUSION PDF ---
  pdf: ^3.10.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_poste.png